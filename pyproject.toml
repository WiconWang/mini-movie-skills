[project]
name = "mini-movie-maker"
version = "0.1.0"
description = "长视频浓缩工作流：几小时长视频 + 准确台词 → 十几分钟解说短视频"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.1"]

[project.scripts]
mmm = "mmm.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
