# catalog.example.yaml —— 素材台账模板（进 Git）
# 真实素材登记请复制为本机 catalog.yaml（已 gitignore，不入库）：
#   cp catalog.example.yaml catalog.yaml
# 编辑后执行 mmm catalog-import 导入 pipeline.sqlite 的 catalog 表
# 字段规范见 docs/2026/0817-物料规范.md §5

videos:
  - video_id: example-01          # 必填，分配后不变；不编码业务含义
    series: 原神                  # 必填，关联 config/series/ 下的类型适配层配置
    version: "1.0"                # 可选，参与命名模板
    chapter: 示例章节              # 可选，参与命名模板
    path: materials/example-01    # 必填，相对项目根；目录内放 source.mp4 + script.jsonl
