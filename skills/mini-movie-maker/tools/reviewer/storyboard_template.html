<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分镜板 · mini-movie-maker</title>
<style>
  :root {
    --bg:#0f1115; --card:#181b22; --card2:#1f232c; --line:#2a2f3a;
    --fg:#e6e8ee; --dim:#8b91a1; --accent:#6ea8fe; --gold:#e0a458;
    --ok:#2fbf71; --err:#ff6b6b;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--fg); font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; padding:24px 28px 90px; }
  header { display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:18px; border-bottom:1px solid var(--line); padding-bottom:14px; }
  h1 { font-size:20px; letter-spacing:.5px; }
  .meta { color:var(--dim); font-size:12px; }
  .counts { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  .counts .badge { font-size:11px; }
  main#board { display:flex; flex-direction:column; gap:14px; }
  .clip { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; display:flex; gap:16px; box-shadow:0 2px 8px rgba(0,0,0,.35); transition:border-color .15s; }
  .clip:hover { border-color:#3a4150; }
  .clip.raw_insert { border-color:var(--gold); background:linear-gradient(180deg, rgba(224,164,88,.07), transparent 30%), var(--card); }
  .frames { display:flex; gap:6px; flex-shrink:0; align-items:flex-start; }
  .frames img { width:148px; height:83px; object-fit:cover; object-position:center; border-radius:8px; display:block; background:#000; outline:1px solid var(--line); }
  .frames img:first-child { outline-color:var(--accent); }
  .body { flex:1; min-width:0; }
  .headrow { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .badge { display:inline-block; padding:2px 10px; border-radius:20px; font-size:12px; font-weight:700; letter-spacing:.5px; }
  .badge.E { background:#8e5cf7; color:#fff; } .badge.D { background:#3f8cff; color:#fff; } .badge.C { background:#2fbf71; color:#0c2015; }
  .badge.B { background:#d9b93a; color:#221d04; } .badge.A { background:#5a6270; color:#fff; }
  .badge.raw { background:var(--gold); color:#241703; }
  .badge.narration { background:var(--accent); color:#0b1523; }
  .time { color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums; }
  .narr { margin:8px 0 10px; font-size:15px; line-height:1.75; color:#dde1ea; }
  .narr .seg { background:var(--card2); border-radius:6px; padding:0 6px; color:var(--dim); font-size:12px; }
  .ops { display:flex; gap:8px; flex-wrap:wrap; }
  .ops button { background:var(--card2); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:4px 12px; font-size:12px; cursor:pointer; transition:all .12s; }
  .ops button:hover { border-color:var(--accent); color:var(--accent); }
  .ops button.danger:hover { border-color:var(--err); color:var(--err); }
  .cands { display:none; margin-top:12px; border-top:1px dashed var(--line); padding-top:12px; }
  .cands.open { display:flex; gap:10px; flex-wrap:wrap; }
  .cand { width:130px; cursor:pointer; border:2px solid transparent; border-radius:8px; padding:3px; background:var(--card2); transition:border-color .12s; }
  .cand:hover { border-color:var(--accent); }
  .cand img { width:100%; height:73px; object-fit:cover; object-position:center; border-radius:5px; display:block; background:#000; }
  .cand .cmeta { font-size:11px; color:var(--dim); text-align:center; margin-top:2px; }
  .cand .cmeta b { color:var(--fg); }
  .range-edit { display:none; margin-top:10px; gap:8px; align-items:center; font-size:12px; color:var(--dim); }
  .range-edit.open { display:flex; }
  .range-edit input { width:90px; background:var(--card2); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:4px 10px; font-variant-numeric:tabular-nums; }
  #exportbar { position:fixed; left:0; right:0; bottom:0; background:rgba(18,20,26,.92); backdrop-filter:blur(8px); border-top:1px solid var(--line); padding:12px 28px; display:flex; gap:14px; align-items:center; z-index:10; }
  #exportbar button { background:var(--accent); color:#0b1523; border:none; border-radius:10px; padding:9px 22px; font-weight:700; cursor:pointer; font-size:14px; transition:filter .12s; }
  #exportbar button:hover { filter:brightness(1.1); }
  #dirty { color:var(--gold); font-size:12px; font-weight:600; }
  #est { color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums; }
  .empty { color:var(--dim); padding:30px; text-align:center; }
</style>
</head>
<body>
<header>
  <div>
    <h1 id="title">分镜板</h1>
    <div class="meta" id="subtitle"></div>
    <div class="counts" id="counts"></div>
  </div>
  <div class="meta">闸口2 · 改完点底部「导出 EDL」交给 Agent 重跑</div>
</header>
<main id="board"></main>
<div id="exportbar">
  <button onclick="exportEDL()">导出 EDL（下载 edl.json）</button>
  <span id="est"></span>
  <span id="dirty"></span>
</div>

<script id="mmdata" type="application/json">__DATA__</script>
<script>
const DATA = JSON.parse(document.getElementById('mmdata').textContent);
let edl = DATA.edl;
let dirty = false;

document.getElementById('title').textContent = DATA.title || '分镜板';
document.getElementById('subtitle').textContent =
  `任务 ${DATA.task_id} · ${edl.clips.length} 个片段 · 目标 ${DATA.target_minutes || '?'} 分钟`;

function fmt(t){ const m=Math.floor(t/60), s=(t%60).toFixed(1); return `${m}:${s.padStart(4,'0')}`; }
function estDuration(){ return edl.clips.reduce((a,c)=>a+(c.end-c.start),0); }
function refreshEst(){
  document.getElementById('est').textContent = `预计成片 ${fmt(estDuration())}`;
  document.getElementById('dirty').textContent = dirty ? '● 有未导出修改' : '';
  const by = {};
  edl.clips.forEach(c => { const k = c.type==='raw_insert' ? 'raw' : (c.class||'?'); by[k] = (by[k]||0)+1; });
  const order = ['E','D','C','B','A','raw'];
  const html = order.filter(k => by[k]).map(k => `<span class="badge ${k}">${k}×${by[k]}</span>`).join('');
  document.getElementById('counts').innerHTML = html;
}

function render(){
  const board = document.getElementById('board');
  board.innerHTML = '';
  edl.clips.forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'clip' + (c.type === 'raw_insert' ? ' raw_insert' : '');
    const badge = c.type === 'raw_insert'
      ? '<span class="badge raw">高光·原声</span>'
      : `<span class="badge ${c.class||'A'}">${c.class||'?'}级</span>`;
    div.innerHTML = `
      <div class="frames">${(c.frames||[]).map(f=>`<img src="${f}" loading="lazy">`).join('') || '<span class="meta">无帧</span>'}</div>
      <div class="body">
        <div class="headrow">${badge}<span class="time">${c.video_id} · ${fmt(c.start)} → ${fmt(c.end)}（${(c.end-c.start).toFixed(1)}s）</span></div>
        <div class="narr">${(c.text || c.note || '').replace(/</g,'&lt;')}</div>
        <div class="ops">
          <button onclick="toggleCands(${i})">换镜头</button>
          <button onclick="toggleRange(${i})">调区间</button>
          <button onclick="insertRaw(${i})">＋在此后插高光段</button>
          <button class="danger" onclick="delClip(${i})">删除</button>
        </div>
        <div class="cands" id="cands-${i}">${(c.candidates||[]).map((k,j)=>`
          <div class="cand" onclick="swap(${i},${j})">
            <img src="${k.frame}" loading="lazy"><div class="cmeta"><b>${k.class}级</b> · ${fmt(k.start)}→${fmt(k.end)}</div>
          </div>`).join('') || '<span class="meta">无候选</span>'}
        </div>
        <div class="range-edit" id="range-${i}">
          起 <input id="rs-${i}" value="${c.start}"> 止 <input id="re-${i}" value="${c.end}">
          <button onclick="applyRange(${i})">应用</button>
        </div>
      </div>`;
    board.appendChild(div);
  });
  refreshEst();
}

function markDirty(){ dirty = true; refreshEst(); }
function toggleCands(i){ document.getElementById(`cands-${i}`).classList.toggle('open'); }
function toggleRange(i){ document.getElementById(`range-${i}`).classList.toggle('open'); }
function swap(i, j){
  const k = edl.clips[i].candidates[j];
  edl.clips[i].start = k.start; edl.clips[i].end = k.end;
  edl.clips[i].video_id = k.video_id || edl.clips[i].video_id;
  edl.clips[i].class = k.class;
  if (k.frames) edl.clips[i].frames = k.frames; else edl.clips[i].frames = [k.frame];
  markDirty(); render();
}
function applyRange(i){
  edl.clips[i].start = parseFloat(document.getElementById(`rs-${i}`).value);
  edl.clips[i].end = parseFloat(document.getElementById(`re-${i}`).value);
  markDirty(); render();
}
function delClip(i){ edl.clips.splice(i,1); markDirty(); render(); }
function insertRaw(i){
  const start = parseFloat(prompt('高光段起点（秒，源视频时间）', '0'));
  const end = parseFloat(prompt('高光段终点（秒）', '0'));
  if (!(end > start)) return;
  edl.clips.splice(i+1, 0, { type:'raw_insert', video_id: edl.clips[i].video_id,
    start, end, keep_audio:true, note:'人工插入高光段', frames:[] });
  markDirty(); render();
}
function exportEDL(){
  const blob = new Blob([JSON.stringify(edl, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'edl.json';
  a.click();
  dirty = false; refreshEst();
}
render();
</script>
</body>
</html>
