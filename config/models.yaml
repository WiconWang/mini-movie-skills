defaults:
  protocol: openai_chat_completions
  temperature_mode: passthrough
  max_tokens_field: max_tokens
  input_context_tokens: 131072
  safety_margin_tokens: 8192
  timeout_seconds: 300
  retry_backoff_seconds: 5
  min_interval_seconds: 0.5
  capabilities:
    - text
  request_extra: {}

profiles:
  opencode_go:
    protocol: openai_chat_completions
    temperature_mode: passthrough
    max_tokens_field: max_tokens
    input_context_tokens: 1000000
    safety_margin_tokens: 16384
    timeout_seconds: 300
    retry_backoff_seconds: 5
    capabilities:
      - text
      - image

  deepseek_official:
    protocol: openai_chat_completions
    temperature_mode: passthrough
    max_tokens_field: max_tokens
    input_context_tokens: 1000000
    safety_margin_tokens: 16384
    timeout_seconds: 300
    retry_backoff_seconds: 5
    capabilities:
      - text
      - image
    # DeepSeek V4.1 默认思考模式；显式固化以避免默认变更漂移。
    # 注意：思考模式下 temperature 被服务端忽略（不报错）。
    request_extra:
      thinking:
        type: enabled
      reasoning_effort: high

  minimax_cn:
    protocol: openai_chat_completions
    temperature_mode: passthrough
    max_tokens_field: max_tokens
    # MiniMax 未公开 M3.x 的上下文长度，取保守值，避免预算检查放行后被服务端截断
    input_context_tokens: 131072
    safety_margin_tokens: 16384
    timeout_seconds: 300
    retry_backoff_seconds: 5
    capabilities:
      - text
      - image
    # 注意：MiniMax 的 M3 系列是推理模型，reasoning 计入 max_tokens；
    # 预算不足时返回 content="" + finish_reason=length，思考内容在 reasoning_content 字段。
    # 因此本档案下各路由的 max_tokens 必须给足（见 routes 段）。

  kimi_official:
    protocol: openai_chat_completions
    temperature_mode: omit
    max_tokens_field: max_tokens
    input_context_tokens: 262144
    safety_margin_tokens: 16384
    timeout_seconds: 480
    retry_backoff_seconds: 5
    capabilities:
      - text

routes:
  narrate_low:
    defaults:
      temperature: 0.6
      max_tokens: 65536
      narration_segment_workers: 1
      max_retries: 1
      retryable_status_codes: [429, 500, 502, 503]
      retry_network_errors: true

  narrate_high:
    defaults:
      temperature: 0.4
      max_tokens: 32768
      max_retries: 0
      retryable_status_codes: []
      retry_network_errors: true
      timeout_seconds: 900

  vision:
    defaults:
      max_tokens: 12000
      temperature: null
      max_retries: 1
      retryable_status_codes: [429, 500, 502, 503]
      retry_network_errors: true

  tts_plan:
    defaults:
      max_tokens: 65536
      temperature: 0.2
      max_retries: 1
      retryable_status_codes: []
      retry_network_errors: false
