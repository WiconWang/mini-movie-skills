defaults:
  protocol: openai_chat_completions
  temperature_mode: passthrough
  max_tokens_field: max_tokens
  input_context_tokens: 131072
  safety_margin_tokens: 8192
  timeout_seconds: 300
  retry_backoff_seconds: 5
  min_interval_seconds: 0.5
  capabilities:
    - text
  request_extra: {}

profiles:
  opencode_go:
    protocol: openai_chat_completions
    temperature_mode: passthrough
    max_tokens_field: max_tokens
    input_context_tokens: 1000000
    safety_margin_tokens: 16384
    timeout_seconds: 300
    retry_backoff_seconds: 5
    capabilities:
      - text
      - image

  deepseek_official:
    protocol: openai_chat_completions
    temperature_mode: passthrough
    max_tokens_field: max_tokens
    input_context_tokens: 131072
    safety_margin_tokens: 8192
    timeout_seconds: 300
    retry_backoff_seconds: 5
    capabilities:
      - text

  kimi_official:
    protocol: openai_chat_completions
    temperature_mode: omit
    max_tokens_field: max_tokens
    input_context_tokens: 262144
    safety_margin_tokens: 16384
    timeout_seconds: 480
    retry_backoff_seconds: 5
    capabilities:
      - text

routes:
  narrate_low:
    defaults:
      temperature: 0.6
      max_tokens: 65536
      narration_segment_workers: 1
      max_retries: 1
      retryable_status_codes: [429, 500, 502, 503]
      retry_network_errors: true

  narrate_high:
    defaults:
      temperature: 0.4
      max_tokens: 32768
      max_retries: 0
      retryable_status_codes: []
      retry_network_errors: true
      timeout_seconds: 900

  vision:
    defaults:
      max_tokens: 1500
      temperature: null
      max_retries: 1
      retryable_status_codes: [429, 500, 502, 503]
      retry_network_errors: true

  tts_plan:
    defaults:
      max_tokens: 16384
      temperature: 0.2
      max_retries: 0
      retryable_status_codes: []
      retry_network_errors: false
