# 原神系列 · 类型适配层配置
# 任务创建时继承（catalog.create_task），task.json 可逐项覆盖
# 字段含义见设计文档 §2 类型适配层、§4 阶段7

# 画面分级表（E→A 选片优先级；当前硬编码在 stage_index.classify，
# 此处声明为系列语义文档，后续重构为配置驱动）
class_table:
  E: 标志性过场（黑/白屏边界、无 UI、电影化演出）
  D: 无台词运镜画面（无台词覆盖、无 UI、有动作）
  C: 高动态画面（战斗/特效，不强制台词覆盖）
  B: 对话画面（有台词、有运镜/动作）
  A: 静态对话（有台词、固定机位、带 UI）

# 成片命名模板（字段：task_id/series/version/chapter/video_id）
title_template: "原神{version}-{chapter}"

# 片头组合（阶段7 composition；src 相对项目根）
composition:
  - {type: intro_special, src: assets/intros/genshin-1.6/1.6盛夏.mp4}

# 字幕模式：overlay（白边描边压画面，含底部模糊遮罩）/ letterbox（黑边电影画幅，未实现）
subtitle_mode: overlay

# overlay 字幕样式 + 画面适配 + 底部模糊遮罩（系列级默认，因游戏/源 UI 布局可不同）。
# 该块会被 catalog.create_task 继承到 task.json；任务/片段可覆盖。
subtitle:
  # 字幕字体（需与 assets/fonts 下文件名对应；libass 经运行时 fontconfig 命中，不注册系统字体）
  font_name: LXGW WenKai Medium
  font_size: 42             # 基准 PlayRes 1280x720
  outline: 2.5              # 白字黑描边
  margin_v: 40              # 底部边距，落在遮罩带内
  play_res: [1280, 720]
  max_chars_per_screen: 18  # 每屏最大字数，语速联动
  # overlay 画面适配：放大 1.024、上移 12.96，让右下角 UID 刚好整行出画。
  # 不同录制源 UID 位置不同可 per-clip 覆盖
  overlay_transform: {scale: 1.024, offset_x: 0, offset_y: -12.96}
  # 底部模糊遮罩：盖住游戏原字幕并在其上方烧解说字幕；边缘羽化避免生硬矩形
  overlay_mask:
    enabled: true
    x: [210, 1710]          # 横向范围（宽1500，居中）
    y: [860, 1080]          # 纵向范围（高220）
    blur_sigma: 20          # 高斯模糊强度
    feather_top: 34         # 上边缘羽化像素数
    feather_side: 22        # 左右边缘羽化像素数

# BGM 歌单（任务级人工指定，与剧情地区/氛围相符；顺序铺设、放完循环）
bgm_playlist:
  - "assets/bgm/genshin-1.6/希望的航程.mp3"
  - "assets/bgm/genshin-1.6/广袤的晴空.mp3"
  - "assets/bgm/genshin-1.6/无虑无猜的岁月.mp3"
  - "assets/bgm/genshin-1.6/水母之歌.mp3"
  - "assets/bgm/genshin-1.6/海螺中的回音.mp3"
  - "assets/bgm/genshin-1.6/海风细语.mp3"
  - "assets/bgm/genshin-1.6/遥远的嘱托.mp3"
  - "assets/bgm/genshin-1.6/闲适的陪伴.mp3"

# TTS 统一适配层配置（任务可覆盖 task.json 的 tts 字段）
# dry 固定走 Edge TTS；prod 默认 MiniMax，用户可替换 provider。
# 启用 prod 前必须在 task.json prod.voice_id 显式配置账户可用音色。
tts:
  profile: prod
  strategy: full_then_split
  maximum_pause_ms: 2000
  dry:
    provider: edge
    model: edge-neural
    voice: zh-CN-XiaoyiNeural
    speed: 1.1
  prod:
    provider: minimax
    model: speech-2.8-hd
    # 已验证音色（2026-09-01 试音通过）；备选：Chinese (Mandarin)_IntellectualGirl
    voice_id: Chinese_playful_streamer_nv1
    speed: 1.1
    emotion: calm
    sample_rate: 44100
    format: wav
    channel: 1

# 目标正片时长（分钟，不含 raw_insert）
target_minutes: 15

# 输出规格（剪辑开始前 Skill 询问确认，用户不提供时用此默认）
# 所有源素材等比缩放适配此分辨率（必要时居中 pad 黑边）
output:
  width: 1920
  height: 1080
  fps: 30
